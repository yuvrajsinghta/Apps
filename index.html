
<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PU Foam Packing Cost Calculator</title>
<style>
  :root {
    --marble: #EEEAE2;
    --marble-vein: #D8D1C4;
    --stone: #3A362F;
    --stone-soft: #6B6558;
    --bronze: #A9702F;
    --bronze-deep: #7E4F1F;
    --danger: #A13A2E;
    --ok-bg: #F4EFE3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--marble);
    background-image:
      radial-gradient(circle at 15% 20%, rgba(255,255,255,0.5) 0%, transparent 35%),
      radial-gradient(circle at 85% 80%, rgba(0,0,0,0.04) 0%, transparent 40%);
    color: var(--stone);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    justify-content: center;
  }

  .sheet {
    width: 100%;
    max-width: 640px;
    background: #FBFAF7;
    border: 1px solid var(--marble-vein);
    box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 18px 40px -20px rgba(58,54,47,0.35);
  }

  .sheet-head {
    padding: 34px 38px 26px;
    border-bottom: 1px solid var(--marble-vein);
    position: relative;
  }

  .sheet-head::after {
    content: "";
    position: absolute;
    left: 38px;
    bottom: -1px;
    width: 44px;
    height: 3px;
    background: var(--bronze);
  }

  .kicker {
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: var(--stone-soft);
    margin: 0 0 6px;
  }

  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 26px;
    margin: 0;
    color: var(--stone);
  }

  .sheet-body { padding: 30px 38px 38px; }

  .section { margin-bottom: 26px; }

  .section-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--marble-vein);
    margin-bottom: 12px;
  }

  .section-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--bronze-deep);
    margin: 0;
  }

  .unit-toggle {
    display: flex;
    gap: 0;
    border: 1px solid var(--marble-vein);
    border-radius: 2px;
    overflow: hidden;
    flex-shrink: 0;
  }

  .unit-toggle button {
    all: unset;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 8px;
    color: var(--stone-soft);
    background: #fff;
  }

  .unit-toggle button.active {
    background: var(--stone);
    color: #F3EEE3;
  }

  .row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .foam-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .field label {
    display: block;
    font-size: 12px;
    color: var(--stone-soft);
    margin-bottom: 5px;
  }

  .field input,
  .field select {
    width: 100%;
    padding: 9px 10px;
    font-size: 14.5px;
    border: 1px solid var(--marble-vein);
    background: #fff;
    color: var(--stone);
    border-radius: 2px;
    font-family: inherit;
  }

  .field select { cursor: pointer; }

  .field input:focus,
  .field select:focus {
    outline: none;
    border-color: var(--bronze);
    box-shadow: 0 0 0 3px rgba(169,112,47,0.12);
  }

  .field-note {
    font-size: 11.5px;
    color: var(--stone-soft);
    margin-top: 5px;
  }

  button.calc-btn {
    width: 100%;
    padding: 13px;
    font-size: 14.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
    background: var(--stone);
    color: #F3EEE3;
    border: none;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  button.calc-btn:hover { background: var(--bronze-deep); }
  button.calc-btn:active { transform: translateY(1px); }

  .result {
    margin-top: 26px;
    border: 1px solid var(--marble-vein);
    background: var(--ok-bg);
    padding: 20px 22px;
    display: none;
  }

  .result.show { display: block; }
  .result.error { background: #F7EDEA; border-color: #E3C4BC; }

  .result-headline {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 24px;
    font-weight: 600;
    color: var(--stone);
    margin: 0 0 14px;
  }

  .result-headline.error-text { color: var(--danger); font-size: 15px; font-family: inherit; font-weight: 600; }

  .breakdown { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .breakdown tr td { padding: 5px 0; }
  .breakdown tr td:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--stone); }
  .breakdown tr td:first-child { color: var(--stone-soft); }
  .breakdown tr.total td { border-top: 1px solid var(--marble-vein); padding-top: 9px; margin-top: 4px; font-weight: 700; color: var(--stone); }

  .calc-divider {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 40px 0 34px;
  }

  .calc-divider::before,
  .calc-divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: var(--marble-vein);
  }

  .calc-divider span {
    font-size: 11.5px;
    letter-spacing: 0.03em;
    color: var(--stone-soft);
    white-space: nowrap;
  }

  h2.calc-title {
    font-family: Georgia, "Times New Roman", serif;
    font-weight: 600;
    font-size: 21px;
    margin: 0 0 24px;
    color: var(--stone);
  }

  .field.hidden { display: none; }

  @media (max-width: 480px) {
    .row, .foam-grid { grid-template-columns: 1fr; }
    .sheet-head, .sheet-body { padding-left: 22px; padding-right: 22px; }
  }
</style>
</head>
<body>

<div class="sheet">
  <div class="sheet-head">
    <p class="kicker">Handicraft Bazaar &nbsp;·&nbsp; Packing</p>
    <h1>PU Foam Cost Calculator</h1>
  </div>

  <div class="sheet-body">

    <div class="section">
      <div class="section-title-row">
        <p class="section-title">Box Dimension</p>
        <div class="unit-toggle" id="boxUnitToggle">
          <button type="button" class="active" data-unit="in" onclick="setUnit('box','in')">inch</button>
          <button type="button" data-unit="mm" onclick="setUnit('box','mm')">mm</button>
          <button type="button" data-unit="cm" onclick="setUnit('box','cm')">cm</button>
          <button type="button" data-unit="m" onclick="setUnit('box','m')">m</button>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="boxL">Length</label>
          <input id="boxL" type="number" step="any" min="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="boxW">Width</label>
          <input id="boxW" type="number" step="any" min="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="boxH">Height</label>
          <input id="boxH" type="number" step="any" min="0" inputmode="decimal">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="section-title-row">
        <p class="section-title">Product Dimension</p>
        <div class="unit-toggle" id="itemUnitToggle">
          <button type="button" class="active" data-unit="in" onclick="setUnit('item','in')">inch</button>
          <button type="button" data-unit="mm" onclick="setUnit('item','mm')">mm</button>
          <button type="button" data-unit="cm" onclick="setUnit('item','cm')">cm</button>
          <button type="button" data-unit="m" onclick="setUnit('item','m')">m</button>
        </div>
      </div>
      <div class="row">
        <div class="field">
          <label for="itemL">Length</label>
          <input id="itemL" type="number" step="any" min="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="itemW">Width</label>
          <input id="itemW" type="number" step="any" min="0" inputmode="decimal">
        </div>
        <div class="field">
          <label for="itemH">Height</label>
          <input id="itemH" type="number" step="any" min="0" inputmode="decimal">
        </div>
      </div>
    </div>

    <div class="section">
      <div class="foam-grid">
        <div class="field">
          <label for="densityType">Foam grade</label>
          <select id="densityType" onchange="toggleManualDensity('densityType','manualDensity')">
            <option value="5">Low Density F6 (5 kg/m³)</option>
            <option value="10" selected>Medium Density F10 (10 kg/m³)</option>
            <option value="20">High Density F20 (20 kg/m³)</option>
            <option value="manual">Manual entry</option>
          </select>
        </div>
        <div class="field hidden" id="manualDensityField">
          <label for="manualDensity">Density (kg/m³)</label>
          <input id="manualDensity" type="number" step="any" min="0" inputmode="decimal">
        </div>
      </div>
      <p class="field-note">Foam price fixed at ₹450/kg.</p>
    </div>

    <button class="calc-btn" onclick="calculate()">Calculate foam cost</button>

    <div class="result" id="result">
      <p class="result-headline" id="resultHeadline"></p>
      <table class="breakdown" id="breakdown"></table>
    </div>

  </div>
</div>

<script>
const unitState = { box: "in", item: "in" };

function setUnit(section, unit) {
  unitState[section] = unit;
  const toggle = document.getElementById(section + "UnitToggle");
  toggle.querySelectorAll("button").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.unit === unit);
  });
}

function toggleManualDensity(selectId, manualId) {
  const isManual = document.getElementById(selectId).value === "manual";
  document.getElementById(manualId + "Field").classList.toggle("hidden", !isManual);
}

function fmt(n, decimals) {
  return n.toLocaleString('en-IN', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function getVal(id) {
  return parseFloat(document.getElementById(id).value);
}

function toMeters(value, unit) {
  switch (unit) {
    case "mm": return value * 0.001;
    case "cm": return value * 0.01;
    case "m": return value;
    default: return value * 0.0254; // inch
  }
}

function getDensity(selectId, manualId) {
  const selectVal = document.getElementById(selectId).value;
  if (selectVal === "manual") {
    return getVal(manualId);
  }
  return parseFloat(selectVal);
}

const FOAM_PRICE = 450; // ₹/kg, fixed

function calculate() {
  const dimIds = ["boxL","boxW","boxH","itemL","itemW","itemH"];
  const raw = {};
  for (const id of dimIds) raw[id] = getVal(id);

  const resultBox = document.getElementById("result");
  const headline = document.getElementById("resultHeadline");
  const breakdown = document.getElementById("breakdown");

  const density = getDensity("densityType", "manualDensity");

  const missing = dimIds.filter(id => isNaN(raw[id]));
  if (missing.length || isNaN(density)) {
    resultBox.className = "result show error";
    headline.className = "result-headline error-text";
    headline.textContent = "Please fill in every field before calculating.";
    breakdown.innerHTML = "";
    return;
  }

  const boxL = toMeters(raw.boxL, unitState.box), boxW = toMeters(raw.boxW, unitState.box), boxH = toMeters(raw.boxH, unitState.box);
  const itemL = toMeters(raw.itemL, unitState.item), itemW = toMeters(raw.itemW, unitState.item), itemH = toMeters(raw.itemH, unitState.item);

  const boxVolume = boxL * boxW * boxH;
  const itemVolume = itemL * itemW * itemH;
  const emptySpace = boxVolume - itemVolume;

  if (emptySpace <= 0) {
    resultBox.className = "result show error";
    headline.className = "result-headline error-text";
    headline.textContent = "Item is the same size as or larger than the box — no empty space to fill.";
    breakdown.innerHTML = `
      <tr><td>Box volume</td><td>${fmt(boxVolume * 1e6, 0)} cm³</td></tr>
      <tr><td>Item volume</td><td>${fmt(itemVolume * 1e6, 0)} cm³</td></tr>
    `;
    return;
  }

  const foamWeight = emptySpace * density;
  const totalCost = foamWeight * FOAM_PRICE;

  resultBox.className = "result show";
  headline.className = "result-headline";
  headline.textContent = "₹ " + fmt(totalCost, 2);

  breakdown.innerHTML = `
    <tr><td>Box volume</td><td>${fmt(boxVolume * 1e6, 0)} cm³</td></tr>
    <tr><td>Item volume</td><td>${fmt(itemVolume * 1e6, 0)} cm³</td></tr>
    <tr><td>Empty space to fill</td><td>${fmt(emptySpace * 1e6, 0)} cm³</td></tr>
    <tr><td>Foam weight</td><td>${fmt(foamWeight, 3)} kg</td></tr>
    <tr class="total"><td>Total cost (@ ₹${FOAM_PRICE}/kg)</td><td>₹ ${fmt(totalCost,2)}</td></tr>
  `;
}
</script>

</body>
</html>
